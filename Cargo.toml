[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/yupix/auth-core"

[workspace.dependencies]
aes-gcm = "0.11"
anyhow = "1.0.102"
async-trait = "0.1"
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hkdf = "0.13"
jsonwebtoken = { version = "9", features = ["use_pem"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11"
thiserror = "2.0.10"
tokio = { version = "1.52.1", features = ["rt", "rt-multi-thread"] }
url = "2.5"
urlencoding = "2.1"
